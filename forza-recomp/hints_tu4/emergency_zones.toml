# The game's emergency zone loads write past their 7-entry list (#902, src/hooks/emergency_zones.cpp).
# CTrackPresentation::ManageEmergencyPVSZLoading (sub_82E27480) appends every wanted zone that is
# not streamed yet to m_EmergencyPVSZList[7] with no check against its size. Before it asks for a
# zone (0x82E27590, reached only for a zone not in the streamed list), the hook looks at the
# count (r23 holds its address; the hook takes the context through r3): with the list full, the
# zone is left out and the loop goes on with the next one (0x82E27614, past the code that would
# mark the emergency unfinished).
[[midasm_hook]]
address = 0x82E27590
name = "ForzaEmergencyZoneListFull"
registers = ["r3"]
jump_address_on_true = 0x82E27614
